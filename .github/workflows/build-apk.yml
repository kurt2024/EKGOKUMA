name: Build Android APK (CardioVision Pro)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Prepare 'www' directory
        run: |
          echo "Web dosyaları www klasörüne taşınıyor..."
          mkdir -p www
          if [ -f index.html ]; then
            cp index.html www/index.html
          else
            echo "HTML dosyası bulunamadı! Lütfen index.html dosyanızı deponun ana dizininde tuttuğunuza emin olun."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize Capacitor Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardiovision-pro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
